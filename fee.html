<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fee Management - Hostel Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="top-header">

        <div>
            <h1>🏠 Hostel Management System</h1>
            <p>Fee Management Portal</p>
        </div>

        <a href="index.html" class="home-btn">
            ← Dashboard
        </a>

    </header>


    <!-- PAGE TITLE -->

    <section class="page-title">

        <h2>Fee Management</h2>

        <p>
            Manage student hostel fee payments
        </p>

    </section>


    <!-- MAIN -->

    <main class="student-container">


        <!-- ADD FEE -->

        <section class="form-card">

            <div class="card-title">

                <h2>💰 Add Fee Payment</h2>

                <p>
                    Enter payment details below
                </p>

            </div>


            <div class="form-grid">


                <div class="input-group">

                    <label>Student Name</label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name">

                </div>


                <div class="input-group">

                    <label>Register Number</label>

                    <input
                        type="text"
                        id="registerNumber"
                        placeholder="Ex: 24CSE101">

                </div>


                <div class="input-group">

                    <label>Amount</label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount">

                </div>


                <div class="input-group">

                    <label>Payment Date</label>

                    <input
                        type="date"
                        id="paymentDate">

                </div>


                <div class="input-group">

                    <label>Payment Status</label>

                    <select id="paymentStatus">

                        <option value="">
                            Select Status
                        </option>

                        <option value="Paid">
                            Paid
                        </option>

                        <option value="Pending">
                            Pending
                        </option>

                    </select>

                </div>

            </div>


            <button
                class="add-btn"
                onclick="addFee()">

                + Add Payment

            </button>

        </section>



        <!-- FEE LIST -->

        <section class="list-card">


            <div class="list-header">

                <div>

                    <h2>📋 Fee Records</h2>

                    <p>
                        Student payment history
                    </p>

                </div>


                <button
                    class="view-btn"
                    onclick="getFees()">

                    🔄 Refresh

                </button>

            </div>


            <div
                id="feeList"
                class="student-table-container">

                <p class="empty-message">

                    Click Refresh to view fee records

                </p>

            </div>


        </section>


    </main>



    <footer>

        <p>
            © 2026 Hostel Management System |
            Fee Portal
        </p>

    </footer>


    <script src="fee.js"></script>

</body>

</html>
