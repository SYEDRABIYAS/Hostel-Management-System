<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Management - Hostel Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="top-header">

        <div>
            <h1>🏠 Hostel Management System</h1>
            <p>Room Management Portal</p>
        </div>

        <a href="index.html" class="home-btn">
            ← Dashboard
        </a>

    </header>


    <!-- PAGE TITLE -->

    <section class="page-title">

        <h2>Room Management</h2>

        <p>
            Add and manage hostel rooms
        </p>

    </section>


    <!-- MAIN -->

    <main class="student-container">


        <!-- ADD ROOM -->

        <section class="form-card">

            <div class="card-title">

                <h2>🛏️ Add New Room</h2>

                <p>
                    Enter room information below
                </p>

            </div>


            <div class="form-grid">


                <div class="input-group">

                    <label>Room Number</label>

                    <input
                        type="text"
                        id="roomNumber"
                        placeholder="Ex: A101">

                </div>


                <div class="input-group">

                    <label>Capacity</label>

                    <input
                        type="number"
                        id="capacity"
                        placeholder="Ex: 4">

                </div>


                <div class="input-group">

                    <label>Occupied</label>

                    <input
                        type="number"
                        id="occupied"
                        placeholder="Ex: 2">

                </div>


                <div class="input-group">

                    <label>Status</label>

                    <select id="status">

                        <option value="">
                            Select Status
                        </option>

                        <option value="Available">
                            Available
                        </option>

                        <option value="Full">
                            Full
                        </option>

                        <option value="Maintenance">
                            Maintenance
                        </option>

                    </select>

                </div>

            </div>


            <button
                class="add-btn"
                onclick="addRoom()">

                + Add Room

            </button>

        </section>



        <!-- ROOM LIST -->

        <section class="list-card">


            <div class="list-header">

                <div>

                    <h2>🏢 Room List</h2>

                    <p>
                        Registered hostel rooms
                    </p>

                </div>


                <button
                    class="view-btn"
                    onclick="getRooms()">

                    🔄 Refresh

                </button>

            </div>



            <div
                id="roomList"
                class="student-table-container">

                <p class="empty-message">

                    Click Refresh to view rooms

                </p>

            </div>


        </section>


    </main>



    <footer>

        <p>
            © 2026 Hostel Management System |
            Room Portal
        </p>

    </footer>



    <script src="room.js"></script>

</body>

</html>
