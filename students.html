<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - Hostel Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-header">
        <div>
            <h1>🏠 Hostel Management System</h1>
            <p>Student Management Portal</p>
        </div>

        <a href="index.html" class="home-btn">← Dashboard</a>
    </header>

    <section class="page-title">
        <h2>Student Management</h2>
        <p>Add and manage hostel students</p>
    </section>

    <main class="student-container">

        <!-- Add Student -->
        <section class="form-card">

            <div class="card-title">
                <h2>👨‍🎓 Add New Student</h2>
                <p>Enter student information below</p>
            </div>

            <div class="form-grid">

                <div class="input-group">
                    <label>Student Name</label>
                    <input type="text" id="name" placeholder="Enter student name">
                </div>

                <div class="input-group">
                    <label>Register Number</label>
                    <input type="text" id="registerNumber" placeholder="Ex: 24CSE101">
                </div>

                <div class="input-group">
                    <label>Department</label>
                    <input type="text" id="department" placeholder="Ex: CSE">
                </div>

                <div class="input-group">
                    <label>Year</label>
                    <input type="number" id="year" placeholder="Ex: 2">
                </div>

                <div class="input-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Phone</label>
                    <input type="text" id="phone" placeholder="Enter phone number">
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter email">
                </div>

                <div class="input-group">
                    <label>Room Number</label>
                    <input type="text" id="roomNumber" placeholder="Ex: A102">
                </div>

                <div class="input-group full">
                    <label>Address</label>
                    <input type="text" id="address" placeholder="Enter address">
                </div>

            </div>

            <button class="add-btn" onclick="addStudent()">
                + Add Student
            </button>

        </section>


        <!-- Student List -->
        <section class="list-card">

            <div class="list-header">
                <div>
                    <h2>📋 Student List</h2>
                    <p>Registered hostel students</p>
                </div>

                <button class="view-btn" onclick="getStudents()">
                    🔄 Refresh
                </button>
            </div>

            <div id="studentList" class="student-table-container">
                <p class="empty-message">
                    Click Refresh to view students
                </p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Hostel Management System | Student Portal</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
